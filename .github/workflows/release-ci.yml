name: Build and Deploy to Playstore

on:
  push:
    branches: [ release ] # Trigger on pushes to the release branch

jobs:
  build:
    runs-on: ubuntu-latest # Use a Linux environment

    steps:
      - uses: actions/checkout@v3 # Checkout your code
      - name: set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Decode and create google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 --decode > app/google-services.json  

      - name: Run unit tests
        run: ./gradlew test

      - name: Clean Gradle build
        run: ./gradlew clean

      - name: Decode and store keystore file
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 --decode > /tmp/KeyStore.jks     

      - name: Build Release Bundle
        run: ./gradlew bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: /tmp/KeyStore.jks

      - name: Check Debug Symbols Output
        run: ls -R app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib || echo "Debug Symbols Not Found"

      - name: Publishing Bundle(.aab) file to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAYSTORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.thit.yawki # your app's package name
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: internal #production,beta,alpha,internal
          status: inProgress
          inAppUpdatePriority: 2
          userFraction: 0.33
          whatsNewDirectory: distribution/whatsnew
          mappingFile: ${{ env.MAPPING_FILE }}
          debugSymbols: app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib

        env:
          MAPPING_FILE: app/build/outputs/mapping/release/mapping.txt
